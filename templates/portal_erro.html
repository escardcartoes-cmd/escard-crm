<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Link Inválido — Portal Krylo</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      background: #F4F0EB;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
      text-align: center;
    }
    .logo { font-size: 28px; font-weight: 800; color: #4A3F35; margin-bottom: 8px; }
    .logo span { color: #C5A089; }
    .card {
      background: #fff;
      border-radius: 12px;
      padding: 40px 32px;
      max-width: 420px;
      width: 100%;
      box-shadow: 0 2px 12px rgba(0,0,0,.07);
      margin-top: 24px;
    }
    .icon { font-size: 48px; margin-bottom: 16px; }
    h1 { font-size: 20px; font-weight: 700; color: #1E293B; margin-bottom: 10px; }
    p { font-size: 14px; color: #64748B; line-height: 1.6; }
    .footer { margin-top: 32px; font-size: 11px; color: #94A3B8; }
  </style>
</head>
<body>
  <div class="logo">Kry<span>lo</span></div>
  <div class="card">
    <div class="icon">🔗</div>
    <h1>Link inválido ou expirado</h1>
    <p>
      Este link de acesso ao Portal do Cliente não é válido ou foi desativado.
      Entre em contato com seu consultor Krylo para obter um novo link de acesso.
    </p>
  </div>
  <div class="footer">Portal Krylo — Soluções em Benefícios Corporativos</div>
</body>
</html>
