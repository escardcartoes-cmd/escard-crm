<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ titulo or 'Erro' }} — {{ tenant.nome_plataforma if tenant else 'Krylo CRM' }}</title>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,sans-serif;
         background:#0A0A0F;color:#E8E8F0;min-height:100vh;display:flex;
         align-items:center;justify-content:center}
    .card{background:#13131A;border:1px solid #2A2A3A;border-radius:16px;
          padding:48px 40px;max-width:520px;width:90%;text-align:center;
          box-shadow:0 24px 48px rgba(0,0,0,.4)}
    .icon{font-size:48px;margin-bottom:20px;display:block}
    h2{font-size:22px;font-weight:700;color:#F0F0F8;margin-bottom:12px}
    p{color:#9090A8;line-height:1.6;margin-bottom:28px;font-size:15px}
    .codigo{display:inline-block;background:#1E1E2E;border:1px solid #2A2A3A;
            border-radius:6px;padding:3px 10px;font-size:12px;color:#6060A0;
            margin-bottom:20px;font-family:monospace}
    .actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
    .btn{display:inline-block;padding:10px 22px;border-radius:8px;
         font-size:14px;font-weight:500;text-decoration:none;cursor:pointer;
         border:none;transition:opacity .15s}
    .btn-primary{background:#C5A089;color:#0A0A0F}
    .btn-primary:hover{opacity:.85}
    .btn-secondary{background:#1E1E2E;color:#E8E8F0;border:1px solid #2A2A3A}
    .btn-secondary:hover{background:#252535}
    pre{text-align:left;background:#0D0D14;border:1px solid #2A2A3A;
        border-radius:8px;padding:14px;font-size:11px;overflow-x:auto;
        color:#6080A0;margin-bottom:24px;line-height:1.5}
  </style>
</head>
<body>
  <div class="card">
    <span class="icon">⚠️</span>
    <h2>{{ titulo or 'Algo deu errado' }}</h2>
    {% if codigo %}<span class="codigo">Código {{ codigo }}</span>{% endif %}
    <p>{{ mensagem or 'Ocorreu um erro inesperado. Tente recarregar a página.' }}</p>
    {% if detalhe and config.DEBUG %}
    <pre>{{ detalhe }}</pre>
    {% endif %}
    <div class="actions">
      <a href="/" class="btn btn-primary">Ir para o Dashboard</a>
      <button onclick="location.reload()" class="btn btn-secondary">Recarregar</button>
    </div>
  </div>
</body>
</html>
