{% extends "base.html" %}
{% block title %}Recuperar Senha{% endblock %}

{% block content %}
<div style="max-width:420px;margin:48px auto;padding:0 16px">
  <div class="card" style="padding:36px 32px">

    <div style="text-align:center;margin-bottom:28px">
      <div style="font-size:44px;margin-bottom:12px">🔑</div>
      <h2 style="font-size:20px;font-weight:800;color:var(--text-primary);margin-bottom:8px">
        Recuperar Senha
      </h2>
      <p style="font-size:13px;color:var(--text-secondary)">
        Informe o email ou telefone da sua conta
      </p>
    </div>

    {% if sucesso %}
    <div class="alert alert-success" style="margin-bottom:20px">{{ sucesso }}</div>
    <div style="text-align:center;margin-top:8px">
      <a href="{{ url_for('auth.nova_senha') }}" class="btn btn-primary"
         style="justify-content:center;width:100%;padding:13px;font-size:14px">
        Inserir código →
      </a>
    </div>

    {% else %}

    {% if erro %}
    <div class="alert alert-danger" style="margin-bottom:20px">{{ erro }}</div>
    {% endif %}

    <form method="post" action="{{ url_for('auth.recuperar_senha') }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="form-group">
        <label>Email ou Telefone</label>
        <input type="text" name="contato" required autofocus
               placeholder="email@empresa.com ou 11999999999">
      </div>
      <button type="submit" class="btn btn-primary"
              style="width:100%;padding:13px;font-size:14px;justify-content:center">
        Enviar código →
      </button>
    </form>

    {% endif %}

    <div style="text-align:center;margin-top:24px">
      <a href="{{ url_for('auth.login') }}"
         style="font-size:12px;color:var(--text-muted);text-decoration:none">
        ← Voltar ao login
      </a>
    </div>

  </div>
</div>
{% endblock %}
