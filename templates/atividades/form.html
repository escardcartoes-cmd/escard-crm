{% extends 'base.html' %}
{% block title %}Registrar Atividade — Escard CRM{% endblock %}
{% block topbar_title %}Registrar Atividade{% endblock %}
{% block topbar_actions %}
  <a href="{{ url_for('atividades_lista') }}" class="btn btn-outline btn-sm">← Voltar</a>
{% endblock %}

{% block content %}
<div class="form-wrap">
  <div class="form-card">
    <form method="post" action="{{ url_for('atividades_nova') }}">
      <input type="hidden" name="next" value="{{ next_url }}">

      <div class="form-section">
        <div class="form-section-title">Vincular a</div>
        <div class="form-row">
          <div class="form-group">
            <label>Empresa</label>
            <select name="empresa_id" id="empresaSelect" onchange="filtrarOps()">
              <option value="">Selecione (opcional)</option>
              {% for e in empresas %}
              <option value="{{ e.id }}" {% if pre_empresa|string == e.id|string %}selected{% endif %}>
                {{ e.nome }}
              </option>
              {% endfor %}
            </select>
          </div>
          <div class="form-group">
            <label>Oportunidade</label>
            <select name="oportunidade_id" id="opSelect">
              <option value="">Selecione (opcional)</option>
              {% for o in oportunidades %}
              <option value="{{ o.id }}"
                      data-empresa="{{ o.empresa_id }}"
                      {% if pre_op|string == o.id|string %}selected{% endif %}>
                {{ o.titulo }} — {{ o.empresa_nome }}
              </option>
              {% endfor %}
            </select>
          </div>
        </div>
      </div>

      <div class="form-section">
        <div class="form-section-title">Atividade</div>
        <div class="form-row">
          <div class="form-group">
            <label>Tipo <span class="req">*</span></label>
            <select name="tipo" required>
              {% for t in tipos %}
              <option value="{{ t }}">{{ t.capitalize() }}</option>
              {% endfor %}
            </select>
          </div>
          <div class="form-group">
            <label>Data</label>
            <input type="date" name="data" id="dataInput">
          </div>
        </div>
        <div class="form-group">
          <label>Descrição / Notas</label>
          <textarea name="descricao" rows="4"
                    placeholder="Resumo da ligação, reunião ou e-mail…"></textarea>
        </div>
      </div>

      <div class="form-actions">
        <button type="submit" class="btn btn-primary">Registrar atividade</button>
        <a href="{{ url_for('atividades_lista') }}" class="btn btn-outline">Cancelar</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
// Set today's date as default
document.getElementById('dataInput').valueAsDate = new Date();

// Filter oportunidades by empresa
function filtrarOps() {
  const empId = document.getElementById('empresaSelect').value;
  const opSel = document.getElementById('opSelect');
  Array.from(opSel.options).forEach(opt => {
    if (!opt.value) return;
    opt.hidden = empId && opt.dataset.empresa !== empId;
  });
  if (empId) {
    const visible = Array.from(opSel.options).find(o => o.value && !o.hidden);
    if (!visible) opSel.value = '';
  }
}

// Auto-fill empresa when op is selected
document.getElementById('opSelect').addEventListener('change', function() {
  const opt = this.options[this.selectedIndex];
  if (opt.value && opt.dataset.empresa) {
    document.getElementById('empresaSelect').value = opt.dataset.empresa;
  }
});

// Run filter on load if pre-filled
filtrarOps();
</script>
{% endblock %}
