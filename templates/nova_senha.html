{% extends "base.html" %}
{% block title %}Nova Senha{% endblock %}

{% block content %}
<div style="max-width:420px;margin:48px auto;padding:0 16px">
  <div class="card" style="padding:36px 32px">

    <div style="text-align:center;margin-bottom:28px">
      <div style="font-size:44px;margin-bottom:12px">🔒</div>
      <h2 style="font-size:20px;font-weight:800;color:var(--text-primary);margin-bottom:8px">
        Criar Nova Senha
      </h2>
    </div>

    {% if sucesso %}
    <div class="alert alert-success" style="margin-bottom:20px">{{ sucesso }}</div>
    <div style="text-align:center;margin-top:8px">
      <a href="{{ url_for('login') }}" class="btn btn-primary"
         style="justify-content:center;width:100%;padding:13px;font-size:14px">
        Fazer login →
      </a>
    </div>

    {% else %}

    {% if erro %}
    <div class="alert alert-danger" style="margin-bottom:20px">{{ erro }}</div>
    {% endif %}

    <form method="post" action="{{ url_for('nova_senha') }}">
      <div class="form-group">
        <label>Email</label>
        <input type="email" name="email" required autofocus placeholder="seu@email.com">
      </div>
      <div class="form-group">
        <label>Código recebido</label>
        <input type="text" name="codigo" required placeholder="000000" maxlength="10"
               style="letter-spacing:4px;font-size:18px;font-weight:700;text-align:center">
      </div>
      <div class="form-group">
        <label>Nova senha</label>
        <input type="password" name="nova_senha" id="novaSenha" required
               placeholder="Mínimo 8 caracteres"
               oninput="verificarForca(this.value)">
        <div style="height:4px;border-radius:4px;margin-top:8px;background:var(--border-default)">
          <div id="forcaFill"
               style="height:100%;border-radius:4px;width:0%;transition:width .3s,background .3s"></div>
        </div>
        <div id="forcaLabel"
             style="font-size:11px;margin-top:4px;color:var(--text-muted);min-height:16px"></div>
      </div>
      <div class="form-group">
        <label>Confirmar senha</label>
        <input type="password" name="confirmar_senha" required placeholder="Repita a senha">
      </div>
      <button type="submit" class="btn btn-primary"
              style="width:100%;padding:13px;font-size:14px;justify-content:center">
        Salvar nova senha →
      </button>
    </form>

    <div style="text-align:center;margin-top:16px">
      <a href="{{ url_for('auth.recuperar_senha') }}"
         style="font-size:12px;color:var(--text-muted);text-decoration:none">
        ← Solicitar novo código
      </a>
    </div>

    {% endif %}

  </div>
</div>

<script>
function verificarForca(senha) {
  var fill  = document.getElementById('forcaFill');
  var label = document.getElementById('forcaLabel');
  var score = 0;
  if (senha.length >= 8)          score++;
  if (senha.length >= 12)         score++;
  if (/[A-Z]/.test(senha))        score++;
  if (/[0-9]/.test(senha))        score++;
  if (/[^A-Za-z0-9]/.test(senha)) score++;
  var pct    = score * 20;
  var cores  = ['', '#EF4444', '#EF4444', '#F59E0B', '#22C55E', '#22C55E'];
  var labels = ['', 'Muito fraca', 'Fraca', 'Moderada', 'Forte', 'Muito forte'];
  fill.style.width      = pct + '%';
  fill.style.background = cores[score]  || '#22C55E';
  label.textContent     = labels[score] || '';
  label.style.color     = cores[score]  || '#22C55E';
}
</script>
{% endblock %}
